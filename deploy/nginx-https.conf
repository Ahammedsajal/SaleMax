server {
    listen 80;
    listen [::]:80;
    server_name crm.salemax.qa;
    location ^~ /.well-known/acme-challenge/ { root /var/www/salemax-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.salemax.qa;
    ssl_certificate /etc/letsencrypt/live/crm.salemax.qa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.salemax.qa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 50m;
    # Private SaleMaX-container path to host-local Asterisk ARI. Keep ARI
    # inaccessible to browsers and the public internet; ARI still uses Basic auth.
    location ^~ /ari/ {
        allow 172.30.240.2;
        deny all;
        proxy_pass http://127.0.0.1:8088/ari/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    # Public agent SIP over WSS; TLS terminates at Nginx and the local Asterisk
    # HTTP server handles the WebSocket upgrade. PJSIP SIP credentials still
    # authenticate each registration; never proxy this path to the SaleMaX app.
    location = /ws {
        proxy_pass http://127.0.0.1:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
