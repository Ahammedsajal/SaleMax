services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: salemax
      MARIADB_USER: salemax
      MARIADB_PASSWORD: ${SALEMAX_DB_PASSWORD:?required}
      MARIADB_ROOT_PASSWORD: ${SALEMAX_DB_ROOT_PASSWORD:?required}
    volumes:
      - /opt/salemax/shared/mysql:/var/lib/mysql
      - /opt/salemax/shared/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: /opt/salemax/shared/runtime.env
    environment:
      SALEMAX_LICENSE_FILE: /app/license-store/license.json
    extra_hosts:
      - "crm.salemax.qa:host-gateway"
    ports: ["127.0.0.1:3011:3010"]
    networks:
      default: {}
      ari_proxy:
        ipv4_address: 172.30.240.2
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - /opt/salemax/shared/license:/app/license-store
      - /opt/salemax/shared/media:/app/client/public/media
      - /opt/salemax/shared/course-media:/app/database/local-runtime/course-media
      - /opt/salemax/shared/meta-media:/app/client/public/meta-media
      - /opt/salemax/shared/sessions:/app/sessions
      - /opt/salemax/shared/themes:/app/routes/themes
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/web/get_web_public').then(r=>r.json()).then(j=>process.exit(j.success?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  default: {}
  ari_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.240.0/28
