services:
  app:
    image: "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_BASE_IMAGE:?Set the exact current app image}"
    volumes:
      - "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_RUNTIME:?Set provider profile runtime directory}/modules/platform/tenant-ai-settings.js:/app/modules/platform/tenant-ai-settings.js:ro"
      - "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_RUNTIME:?Set provider profile runtime directory}/modules/platform/tenant-ai-settings-router.js:/app/modules/platform/tenant-ai-settings-router.js:ro"
      - "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_RUNTIME:?Set provider profile runtime directory}/client/public/ai-integrations.js:/app/client/public/ai-integrations.js:ro"
      - "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_RUNTIME:?Set provider profile runtime directory}/client/public/ai-integrations.css:/app/client/public/ai-integrations.css:ro"
      - "${SALEMAX_TENANT_AI_PROVIDER_PROFILES_RUNTIME:?Set provider profile runtime directory}/database/migrations/20270120_chatbot_provider_profiles.sql:/app/database/migrations/20270120_chatbot_provider_profiles.sql:ro"
