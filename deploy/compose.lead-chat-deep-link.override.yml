services:
  app:
    image: "${SALEMAX_LEAD_CHAT_DEEP_LINK_BASE_IMAGE:?Set the exact current app image}"
    volumes:
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/client/public/index.html"
        target: /app/client/public/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/client/public/inbox-deep-link.js"
        target: /app/client/public/inbox-deep-link.js
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/client/public/pipeline/index.html"
        target: /app/client/public/pipeline/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/client/public/pipeline/lead-detail-workspace.js"
        target: /app/client/public/pipeline/lead-detail-workspace.js
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/helper/socket/index.js"
        target: /app/helper/socket/index.js
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SALEMAX_LEAD_CHAT_DEEP_LINK_RUNTIME:?Set the lead chat deep-link runtime directory}/helper/inbox/chatData.js"
        target: /app/helper/inbox/chatData.js
        read_only: true
        bind:
          create_host_path: false
