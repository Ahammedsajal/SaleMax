<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#A8003B"><title>Sales workspace · SaleMaX</title><link rel="stylesheet" href="/sales-workspace/sales-workspace.css?v=20261013-targets1"></head>
<body><main class="workspace"><header><div><p class="eyebrow" data-en="SALES · OPERATIONS" data-ar="المبيعات · العمليات">SALES · OPERATIONS</p><h1 id="title">Sales workspace</h1><p class="intro" id="intro"></p></div><button id="refresh" class="secondary" type="button">Refresh</button></header>
<nav class="tabs" aria-label="Sales workspace"><button type="button" data-tab="deals">Deals</button><button type="button" data-tab="targets">Targets & performance</button><button type="button" data-tab="commissions">Commissions & payouts</button></nav>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="dealsSection"><div class="toolbar"><h2 id="dealsTitle">Sales deals</h2><label><span id="dealFilterLabel">Status</span><select id="dealFilter"><option value="all">All</option><option value="pending_approval">Pending approval</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></label></div>
<section class="panel" id="submitPanel" hidden><h2 id="submitTitle">Submit a sale</h2><form id="saleForm" class="sale-form"><label><span id="leadLabel">Assigned lead</span><select name="leadId" required><option value="">Loading leads…</option></select></label><label><span id="productLabel">Product or service</span><select name="productId" required><option value="">Loading products…</option></select></label><label><span id="amountLabel">Sale amount</span><input name="amount" type="number" min="0.01" step="0.01" required></label><label><span id="currencyLabel">Currency</span><input name="currency" type="text" maxlength="3" value="QAR" required></label><label><span id="referenceLabel">Sale reference (optional)</span><input name="saleReference" maxlength="191"></label><label class="wide"><span id="noteLabel">Note (optional)</span><textarea name="sellerNote" maxlength="1000" rows="2"></textarea></label><button id="submitSale" type="submit">Submit for approval</button></form></section>
<div id="dealList" class="record-list"></div></section>
<section id="commissionsSection" hidden><div class="toolbar"><h2 id="commissionTitle">Commission ledger</h2><label><span id="commissionFilterLabel">Status</span><select id="commissionFilter"><option value="all">All</option><option value="draft">Needs review</option><option value="approved">Approved for payout</option><option value="paid">Paid</option></select></label></div><p class="muted" id="separationNote"></p><div id="commissionList" class="record-list"></div></section>
<section id="targetsSection" hidden><div class="toolbar"><h2 id="targetsTitle">Targets & performance</h2><label><span id="periodLabel">Month</span><input id="targetPeriod" type="month"></label></div><p id="targetIntro" class="muted"></p><div id="targetList" class="record-list"></div></section>
</main><script src="/sales-workspace/sales-workspace.js?v=20261013-targets1"></script></body></html>
