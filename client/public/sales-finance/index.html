<!doctype html>
<html lang="en"><head><script src="/workspace-modern.js?v=20261019-uplift2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1768d4"><title>Sales Finance · 7Network</title><link rel="stylesheet" href="/sales-design-tokens.css?v=20261014-sales-ui2"><link rel="stylesheet" href="/sales-finance/sales-finance.css?v=20261019-direct-finance1"></head>
<body><main class="workspace"><header><div><p class="eyebrow" data-en="SALES · FINANCE" data-ar="المبيعات · المالية">SALES · FINANCE</p><h1 id="pageTitle">Finance Overview</h1><p class="intro" id="intro"></p></div><button id="refresh" class="secondary" type="button">Refresh</button></header>
<div class="finance-actions"><button id="createInvoice" type="button">Create invoice</button><button id="createReceipt" type="button" class="secondary">Create payment receipt</button></div>
<nav class="tabs" aria-label="Sales finance"><button type="button" data-view="overview">Overview</button><button type="button" data-view="invoices">Invoices &amp; Collections</button><button type="button" data-view="reconciliation">Reconciliation</button><button type="button" data-view="reports">Finance Reports</button></nav>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="overviewView"><div id="overviewCards" class="currency-grid"></div><div class="panel"><div class="toolbar"><h2 id="unbilledTitle">Approved sales ready to invoice</h2></div><div id="unbilledList" class="record-list"></div></div></section>
<section id="invoicesView" hidden><div class="toolbar"><h2 id="invoiceTitle">Invoices &amp; Collections</h2><label><span id="invoiceFilterLabel">View</span><select id="invoiceFilter"><option value="all">All invoices</option><option value="outstanding">Outstanding</option><option value="overdue">Overdue</option><option value="paid">Paid</option><option value="void">Voided</option></select></label></div><div id="invoiceList" class="record-list"></div></section>
<section id="reconciliationView" hidden><div class="panel"><h2 id="receiptTitle">Record a received payment</h2><form id="receiptForm" class="form-grid"><label><span id="payerLabel">Payer</span><input name="payerName" maxlength="255"></label><label><span id="receiptAmountLabel">Amount</span><input name="amount" type="number" min="0.01" step="0.01" required></label><label><span id="receiptCurrencyLabel">Currency</span><input name="currency" maxlength="3" value="QAR" required></label><label><span id="methodLabel">Method</span><select name="paymentMethod"><option value="bank_transfer">Bank transfer</option><option value="cash">Cash</option><option value="card">Card</option><option value="cheque">Cheque</option><option value="other">Other</option></select></label><label><span id="referenceLabel">External reference</span><input name="externalReference" maxlength="191"></label><label><span id="receivedAtLabel">Received at</span><input name="receivedAt" type="datetime-local" required></label><label class="wide"><span id="noteLabel">Note</span><textarea name="note" maxlength="1000" rows="2"></textarea></label><button id="recordReceipt" type="submit">Record payment</button></form></div><div class="toolbar"><h2 id="reconciliationTitle">Receipts to reconcile</h2><label><span id="receiptFilterLabel">Status</span><select id="receiptFilter"><option value="all">All receipts</option><option value="unmatched">Unmatched</option><option value="partially_matched">Partially matched</option><option value="matched">Matched</option><option value="void">Voided</option></select></label></div><div id="receiptList" class="record-list"></div></section>
<section id="reportsView" hidden><div class="panel"><form id="reportForm" class="report-form"><label><span id="fromLabel">From</span><input name="from" type="date" required></label><label><span id="toLabel">To</span><input name="to" type="date" required></label><button type="submit" id="runReport">Run report</button></form></div><div id="reportResults" class="currency-grid"></div></section>
</main>
<dialog id="documentDialog" aria-labelledby="documentTitle"><div id="documentContent"></div><div class="dialog-actions document-controls"><button id="closeDocument" type="button" class="secondary">Close</button><button id="printDocument" type="button">Print / Save PDF</button></div></dialog>
<dialog id="actionDialog" aria-labelledby="actionTitle">
  <form id="actionForm">
    <div class="dialog-heading"><h2 id="actionTitle"></h2><button id="closeAction" class="icon-button" type="button" aria-label="Close">×</button></div>
    <div id="actionFields" class="dialog-fields"></div>
    <p id="actionError" class="dialog-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="cancelAction" class="secondary" type="button">Cancel</button><button id="submitAction" type="submit">Save</button></div>
  </form>
</dialog>
<script src="/sales-finance/sales-finance.js?v=20261019-direct-finance1"></script></body></html>
