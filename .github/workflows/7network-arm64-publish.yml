name: 7Network ARM64 publish

on:
  workflow_run:
    workflows: [7Network ARM64 image]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: 7network-arm64-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ahammedsajal/salemax

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download the exact smoke-tested image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: tested-arm64-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/7network-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Load and verify source and platform labels
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/7network-image/7network-arm64-image.tar"
          image="${IMAGE_NAME}:ci-${SOURCE_SHA}"
          source_sha=$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
          test "$source_sha" = "$SOURCE_SHA"
          test "$platform" = 'linux/arm64'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image under a run-unique tag
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          release_tag="sha-${SOURCE_SHA}-run-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          release_image="${IMAGE_NAME}:${release_tag}"
          if docker manifest inspect "$release_image" >/dev/null 2>&1; then
            echo "Refusing to replace existing registry tag $release_tag" >&2
            exit 1
          fi
          docker tag "${IMAGE_NAME}:ci-${SOURCE_SHA}" "$release_image"
          docker push "$release_image"
          image_id=$(docker image inspect --format '{{.Id}}' "$release_image")
          repo_digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$release_image" | grep -F "${IMAGE_NAME}@sha256:" | head -n 1)
          case "$repo_digest" in
            "${IMAGE_NAME}@sha256:"????????????????????????????????????????????????????????????????) ;;
            *) echo "Registry did not return a valid immutable image digest" >&2; exit 1 ;;
          esac
          digest=${repo_digest#*@}
          {
            echo "## Published ARM64 image"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`."
            echo "- Run-unique tag: \`${release_tag}\`."
            echo "- Immutable deployment reference: \`${IMAGE_NAME}@${digest}\`."
            echo "- Locally smoke-tested image ID: \`${image_id}\`."
            echo "- Platform: \`linux/arm64\`."
          } >> "$GITHUB_STEP_SUMMARY"
