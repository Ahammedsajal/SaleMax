name: 7Network ARM64 image

on:
  pull_request:
    paths: &image_paths
      - '.dockerignore'
      - '.github/workflows/7network-arm64-image.yml'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.js'
      - 'server.js'
      - 'automation/**'
      - 'client/**'
      - 'database/**'
      - 'emails/**'
      - 'feature-contract.js'
      - 'functions/**'
      - 'helper/**'
      - 'languages/**'
      - 'loops/**'
      - 'middlewares/**'
      - 'modules/**'
      - 'routes/**'
      - 'salemax/**'
      - 'scripts/**'
      - 'socket.js'
      - 'tests/docker-image-contract.test.cjs'
      - 'tests/graceful-shutdown.test.cjs'
      - 'utils/**'
  push:
    branches: [main]
    paths: *image_paths

permissions:
  contents: read

concurrency:
  group: 7network-arm64-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/ahammedsajal/salemax

jobs:
  build-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Run Docker release contract checks
        run: node --test tests/docker-image-contract.test.cjs tests/graceful-shutdown.test.cjs

      - name: Build ARM64 image for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          build-args: |
            VCS_REF=${{ github.sha }}
          outputs: type=docker,dest=/tmp/7network-arm64-image.tar
          push: false
          provenance: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the exact ARM64 build for smoke testing
        run: docker load --input /tmp/7network-arm64-image.tar

      - name: Report exact ARM64 image size and layers
        shell: bash
        run: |
          image="${IMAGE_NAME}:ci-${GITHUB_SHA}"
          read -r image_id size_bytes layer_count < <(docker image inspect "$image" --format '{{.Id}} {{.Size}} {{len .RootFS.Layers}}')
          {
            echo '### ARM64 image measurement'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${image}\`"
            echo "- Image ID: \`${image_id}\`"
            echo "- Uncompressed image size: ${size_bytes} bytes"
            echo "- Root filesystem layers: ${layer_count}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Smoke test ARM64 native runtime as non-root
        run: |
          docker run --rm --platform linux/arm64 \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/deploy/verify-container-runtime.cjs,dst=/app/verify-container-runtime.cjs,readonly" \
            --entrypoint node \
            "${IMAGE_NAME}:ci-${GITHUB_SHA}" \
            /app/verify-container-runtime.cjs

      - name: Upload the tested image for trusted publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/7network-arm64-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
